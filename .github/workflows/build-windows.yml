name: Build Nova Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get Nova source code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Build Nova
        run: dotnet publish Nova/Nova.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Make ZIP file
        shell: pwsh
        run: Compress-Archive -Path publish/Nova.exe -DestinationPath Nova-Windows-x64.zip

      - name: Save Nova download
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows-x64
          path: Nova-Windows-x64.zip
